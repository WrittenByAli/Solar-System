server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # location blocks don't inherit add_header from the server block once
    # they define their own — the shared snippet is included in both so
    # neither loses the security headers.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
